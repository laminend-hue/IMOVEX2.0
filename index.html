      (function() {
        // Global error shield: suppress unwanted websocket disconnection messages in preview
        var isWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg);
          return s.indexOf('WebSocket') !== -1 ||
                 s.indexOf('closed without opened') !== -1 ||
                 s.indexOf('failed to connect to websocket') !== -1 ||
                 s.indexOf('@vite/client') !== -1;
        };

        var suppress = function(e) {
          var r = (e && (e.reason || e.error)) || e;
          var msg = (r && (r.message || r.stack || (typeof r === 'string' ? r : ''))) || (e && e.message) || '';
          if (isWsError(msg)) {
            if (e && e.preventDefault) e.preventDefault();
            if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };

        window.addEventListener('unhandledrejection', suppress, true);
        window.addEventListener('error', suppress, true);
      })();
    </script>
